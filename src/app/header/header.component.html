<div class="header">
  <div><img src="img/headerlogo.png" alt="" /></div>
  <div><input type="text" placeholder="Devspace durchsuchen" /></div>
  <div class="">
    <p>Neu bei DABubble?</p>
    <a routerLink="/signin">Konto erstellen</a>
  </div>
  <div class="user-menu d-none">
    <div>
      <span>Frederik Beck</span>
      <img src="img/Profile bild.png" alt="" />
      <div>
        <button
          mat-icon-button
          [matMenuTriggerFor]="beforeMenu"
          aria-label="Example icon-button with a menu"
        >
          <mat-icon>keyboard_arrow_down</mat-icon>
        </button>
        <mat-menu class="menu-box" #beforeMenu="matMenu" xPosition="before">
          <button class="menu-box-btn" mat-menu-item>Profil</button>
          <button class="menu-box-btn" mat-menu-item>Log out</button>
        </mat-menu>
      </div>
    </div>
  </div>
</div>
