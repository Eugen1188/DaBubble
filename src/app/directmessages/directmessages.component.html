<section>
    <div class="chat-header">
        <div>
            <div class="imageContainer">
                <img [src]="currentReciever.profilephoto" alt="">
                <div class="status-dot" [ngClass]="{'green': currentReciever.online}"></div>
            </div>

            <span>{{currentReciever?.fullname}}</span>
        </div>
    </div>
    <div class="chat-content">
        <div  *ngFor="let message of currentMessages; let i=index" [ngClass]="{'change': isUser(message)}">
            <div class="divider" *ngIf="isNewDay(message, currentMessages[i - 1])">
             <div>
                <p>{{isToday(message.time)? 'Heute' : (message.time | date:'EEEE, d MMMM')}}</p>
             </div>
                    
                
                
            </div>
            <div class="messagerow">
                <div class="image">
                    <img [src]="message.photo" alt="">
                </div>
                <div class="messageContainer">
                    <div class="messageData">
                        <span>{{message.name}}</span>
                        <p>{{message.time | date:'HH:mm'}} Uhr</p>
                    </div>
                    <div class="messageBubble">
                        <span>{{message.content}}</span>
                    </div>
                    <div></div>
                </div>
                
            </div>
          
        </div>
        <div *ngIf="isEmpty===true"><p>TEst</p></div>
    </div>
    <div class="textContainer">
        <div>
            <textarea [(ngModel)]="message" name="" id=""
                placeholder="Nachricht an {{currentReciever.fullname}}"></textarea>
            <div>
                <div class="left">
                    <button><img src="./img/sentiment_satisfied.svg" alt=""></button>
                    <button><img src="./img/alternate_email.svg" alt=""></button>
                </div>
                <button (click)="sendMessage()" class="right"><img src="./img/send.svg" alt=""></button>
            </div>
        </div>
    </div>

</section>
